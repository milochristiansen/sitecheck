<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{if .Title}}{{.Title}}{{else}}{{.SiteTitle}}{{end}}</title>
    <link rel="stylesheet" href="{{.StaticPrefix}}style.css">
</head>

    </main>
</body>
</html>
